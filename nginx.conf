server {
    listen 80;
    server_name localhost;

    # Disabilita l'invio della versione di Nginx nell'header Server
    server_tokens off;

    # Limite dimensione upload file
    client_max_body_size 15M;

    # Header di sicurezza HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080;" always;

    # Frontend statico
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy verso il backend Uvicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Documentazione interattiva OpenAPI
    location /docs {
        proxy_pass http://127.0.0.1:8080/docs;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8080/openapi.json;
    }
}

